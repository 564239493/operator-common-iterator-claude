[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operator-common-iterator"
version = "0.1.0"
description = "CANN operator iteration test Claude Code CLI orchestrator"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "torch>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "typing_extensions>=4.0",
    "z3-solver>=4.12",
    "asyncssh>=2.14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
